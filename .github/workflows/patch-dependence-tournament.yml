name: One-shot dependence tournament patch

on:
  push:
    branches:
      - agent/dependence-aware-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dependence-aware-selection
          fetch-depth: 0

      - name: Wire dependence policy into tournament
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/research_tournament.py')
          text = path.read_text()
          marker = 'dependence_block_size: int = 5'
          if marker in text:
              print('dependence tournament patch already present')
              raise SystemExit(0)

          old = '''from scripts.selection_bias import (\n    METHOD as MULTIPLE_TESTING_METHOD,\n    SearchMultiplicityPolicy,'''
          new = '''from scripts.selection_bias import (\n    BLOCK_METHOD,\n    METHOD as MULTIPLE_TESTING_METHOD,\n    SearchMultiplicityPolicy,'''
          if old not in text:
              raise SystemExit('selection_bias import anchor missing')
          text = text.replace(old, new, 1)

          old = '''        "raw_p_value": 1.0,\n        "adjusted_p_value": 1.0,\n        "passed": False,'''
          new = '''        "raw_p_value": 1.0,\n        "marginal_adjusted_p_value": 1.0,\n        "dependence": {\n            "method": BLOCK_METHOD,\n            "block_size": int(policy_artifact.get("dependence_block_size", 5)),\n            "total_blocks": 0,\n            "positive_blocks": 0,\n            "negative_blocks": 0,\n            "zero_blocks": 0,\n            "nonzero_blocks": 0,\n            "raw_p_value": 1.0,\n            "adjusted_p_value": 1.0,\n        },\n        "adjusted_p_value": 1.0,\n        "passed": False,'''
          if old not in text:
              raise SystemExit('invalid assessment anchor missing')
          text = text.replace(old, new, 1)

          old = '''    familywise_alpha: float = 0.05,\n    min_sign_test_trades: int = 10,\n    created_at: str | None = None,'''
          new = '''    familywise_alpha: float = 0.05,\n    min_sign_test_trades: int = 10,\n    dependence_block_size: int = 5,\n    min_nonzero_blocks: int = 5,\n    created_at: str | None = None,'''
          if old not in text:
              raise SystemExit('plan signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''        familywise_alpha=familywise_alpha,\n        min_nonzero_trades=min_sign_test_trades,\n    ).artifact()'''
          new = '''        familywise_alpha=familywise_alpha,\n        min_nonzero_trades=min_sign_test_trades,\n        dependence_block_size=dependence_block_size,\n        min_nonzero_blocks=min_nonzero_blocks,\n    ).artifact()'''
          if old not in text:
              raise SystemExit('policy construction anchor missing')
          text = text.replace(old, new, 1)

          old = '''        max_candidate_trials: int = 20, familywise_alpha: float = 0.05,\n        min_sign_test_trades: int = 10, experiment_id: str | None = None,\n        actor: str = "research-controller",'''
          new = '''        max_candidate_trials: int = 20, familywise_alpha: float = 0.05,\n        min_sign_test_trades: int = 10, dependence_block_size: int = 5,\n        min_nonzero_blocks: int = 5, experiment_id: str | None = None,\n        actor: str = "research-controller",'''
          if old not in text:
              raise SystemExit('create_from_snapshot signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''            min_search_bars=min_search_bars, max_candidate_trials=max_candidate_trials,\n            familywise_alpha=familywise_alpha, min_sign_test_trades=min_sign_test_trades,\n        )'''
          new = '''            min_search_bars=min_search_bars, max_candidate_trials=max_candidate_trials,\n            familywise_alpha=familywise_alpha, min_sign_test_trades=min_sign_test_trades,\n            dependence_block_size=dependence_block_size, min_nonzero_blocks=min_nonzero_blocks,\n        )'''
          if old not in text:
              raise SystemExit('create_from_snapshot plan call anchor missing')
          text = text.replace(old, new, 1)

          old = '''        max_candidate_trials: int = 20, familywise_alpha: float = 0.05,\n        min_sign_test_trades: int = 10, start_ts: float | None = None,\n        end_ts: float | None = None, window_bars: int | None = None,'''
          new = '''        max_candidate_trials: int = 20, familywise_alpha: float = 0.05,\n        min_sign_test_trades: int = 10, dependence_block_size: int = 5,\n        min_nonzero_blocks: int = 5, start_ts: float | None = None,\n        end_ts: float | None = None, window_bars: int | None = None,'''
          if old not in text:
              raise SystemExit('create signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''            max_candidate_trials=max_candidate_trials, familywise_alpha=familywise_alpha,\n            min_sign_test_trades=min_sign_test_trades, experiment_id=experiment_id,\n        )'''
          new = '''            max_candidate_trials=max_candidate_trials, familywise_alpha=familywise_alpha,\n            min_sign_test_trades=min_sign_test_trades, dependence_block_size=dependence_block_size,\n            min_nonzero_blocks=min_nonzero_blocks, experiment_id=experiment_id,\n        )'''
          if old not in text:
              raise SystemExit('create delegation anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          python -m py_compile scripts/research_tournament.py scripts/selection_bias.py
          git diff --check

      - name: Commit production patch
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research_tournament.py
          git commit -m 'wire dependence policy into research tournament'
          git push origin HEAD:agent/dependence-aware-selection
