name: One-shot candidate config binding gate

on:
  push:
    branches:
      - agent/alpha-validation-engine
    paths:
      - .github/workflows/patch-candidate-config-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-validation-engine
          fetch-depth: 1
      - name: Bind validation evidence to proposed candidate config
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/challenger_manager.py")
          text = path.read_text(encoding="utf-8")
          old = '''        elif validation_evidence.get("candidate_id") != challenger_id:\n            result = {\n                "approved": False,\n                "reasons": ["alpha_validation_candidate_mismatch"],\n                "pnl_improvement_usd": 0.0,\n                "drawdown_increase_pct_points": 0.0,\n                "thresholds": {**DEFAULT_THRESHOLDS, **(thresholds or {})},\n                "evaluated_at": _utc_now(),\n                "evidence_hash": validation_evidence.get("evidence_hash"),\n                "evidence_schema_version": validation_evidence.get("schema_version"),\n            }\n        else:\n'''
          new = '''        elif validation_evidence.get("candidate_id") != challenger_id:\n            result = {\n                "approved": False,\n                "reasons": ["alpha_validation_candidate_mismatch"],\n                "pnl_improvement_usd": 0.0,\n                "drawdown_increase_pct_points": 0.0,\n                "thresholds": {**DEFAULT_THRESHOLDS, **(thresholds or {})},\n                "evaluated_at": _utc_now(),\n                "evidence_hash": validation_evidence.get("evidence_hash"),\n                "evidence_schema_version": validation_evidence.get("schema_version"),\n            }\n        elif validation_evidence.get("candidate_config") != challenger.get("parameters"):\n            result = {\n                "approved": False,\n                "reasons": ["alpha_validation_candidate_config_mismatch"],\n                "pnl_improvement_usd": 0.0,\n                "drawdown_increase_pct_points": 0.0,\n                "thresholds": {**DEFAULT_THRESHOLDS, **(thresholds or {})},\n                "evaluated_at": _utc_now(),\n                "evidence_hash": validation_evidence.get("evidence_hash"),\n                "evidence_schema_version": validation_evidence.get("schema_version"),\n            }\n        else:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"evaluate candidate guard match count={text.count(old)}")
          text = text.replace(old, new)

          old = '''        if evidence.get("candidate_id") != challenger_id:\n            raise ValueError("challenger alpha-validation candidate mismatch")\n        if evidence.get("evidence_hash") != evidence_hash:\n'''
          new = '''        if evidence.get("candidate_id") != challenger_id:\n            raise ValueError("challenger alpha-validation candidate mismatch")\n        if evidence.get("candidate_config") != challenger.get("parameters"):\n            raise ValueError("challenger alpha-validation candidate config mismatch")\n        if evidence.get("evidence_hash") != evidence_hash:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"promotion candidate guard match count={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("tests/test_alpha_validation.py")
          text = path.read_text(encoding="utf-8")
          old = '''    challenger = registry.propose(\n        {"lookback": 20},\n        rationale="test",\n'''
          new = '''    challenger = registry.propose(\n        {"lookback": 20, "threshold": 0.7},\n        rationale="test",\n'''
          if text.count(old) != 1:
              raise SystemExit(f"registry fixture match count={text.count(old)}")
          text = text.replace(old, new)

          anchor = '''def test_registry_rejects_unbound_alpha_evidence(tmp_path):\n'''
          test = '''def test_registry_rejects_evidence_for_different_candidate_config(tmp_path):\n    registry, challenger = _registry(tmp_path)\n    evidence = _evidence(challenger["id"])\n    evidence["candidate_config"] = {"lookback": 99, "threshold": 0.7}\n    evidence["candidate_config_hash"] = stable_hash(evidence["candidate_config"])\n    evidence.pop("evidence_hash", None)\n    evidence["evidence_hash"] = stable_hash(evidence)\n    valid, reasons = verify_alpha_validation_evidence(evidence)\n    assert valid, reasons\n\n    result = registry.evaluate(\n        challenger["id"],\n        {"net_pnl_after_cost_usd": 0, "max_drawdown_pct": 0},\n        validation_evidence=evidence,\n    )\n    assert result["approved"] is False\n    assert result["reasons"] == ["alpha_validation_candidate_config_mismatch"]\n\n\n''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f"test insertion anchor count={text.count(anchor)}")
          path.write_text(text.replace(anchor, test), encoding="utf-8")
          PY
          git diff --check
          git diff -- scripts/challenger_manager.py tests/test_alpha_validation.py
      - name: Run focused gate tests
        run: |
          python -m pip install -q -r deploy/requirements.venv-lock.txt
          python -m pytest tests/test_alpha_validation.py --import-mode=importlib -q
      - name: Commit config binding gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/challenger_manager.py tests/test_alpha_validation.py
          git commit -m "fix: bind challenger evidence to proposed config"
          git push origin HEAD:agent/alpha-validation-engine
