name: One-shot certified research runtime Python wiring v2

on:
  push:
    branches:
      - agent/certified-research-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certified-research-runtime
          fetch-depth: 0

      - name: Apply production patch from staged recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          recipe = Path('.github/workflows/patch-certified-research-runtime-python.yml').read_text()
          start = recipe.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = recipe.index("\n          PY", start)
          source = dedent(recipe[start:end])
          exec(compile(source, '<certified-runtime-patch>', 'exec'))
          PY

          python -m py_compile scripts/challenger_manager.py scripts/strategy_signal_scanner.py scripts/runtime_research_certification.py
          python -m pip install -q pytest
          pytest -q tests/test_runtime_research_certification.py tests/test_alpha_validation.py
          git diff --check

      - name: Commit production wiring
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/challenger_manager.py scripts/strategy_signal_scanner.py
          git commit -m 'wire promoted research certification into scanner runtime'
          git push origin HEAD:agent/certified-research-runtime
