name: One-shot Python backtest fee fix

on:
  push:
    branches:
      - agent/alpha-validation-engine
    paths:
      - .github/workflows/fix-python-backtest-fee.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-validation-engine
          fetch-depth: 1
      - name: Apply exact fee conversion correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("strategy_engine.py")
          text = path.read_text(encoding="utf-8")
          old = "    return_pct = gross - (fee_bps / 100.0) * 2.0 * 100.0"
          new = (
              "    # fee_bps is per-side basis points; /100 converts bps to percentage points.\n"
              "    return_pct = gross - (fee_bps / 100.0) * 2.0"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one fee expression, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- strategy_engine.py
      - name: Commit exact correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_engine.py
          git commit -m "fix: correct Python backtest fee basis-point conversion"
          git push origin HEAD:agent/alpha-validation-engine
