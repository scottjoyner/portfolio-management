name: Validate certified execution lifecycle

on:
  push:
    branches:
      - agent/certified-execution-lifecycle

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Spot lifecycle regression
        run: python -m pytest -q tests/test_spot_execution_replay.py
