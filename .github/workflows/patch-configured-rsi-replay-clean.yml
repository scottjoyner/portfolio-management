name: One-shot typed RSI replay patch

on:
  push:
    branches:
      - agent/configured-rsi-replay-v2
    paths:
      - .github/workflows/patch-configured-rsi-replay-clean.yml
      - scripts/_tmp_patch_configured_rsi.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configured-rsi-replay-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply guarded source patch
        run: |
          python scripts/_tmp_patch_configured_rsi.py
          git diff --check
          git diff --stat

      - name: Run Rust unit tests
        working-directory: rust_core
        run: cargo test --locked

      - name: Run portable focused tests
        run: |
          python -m pip install -q -r deploy/requirements.venv-lock.txt
          python -m pytest tests/test_alpha_validation.py tests/test_canonical_replay.py --import-mode=importlib -q

      - name: Build exact Rust package
        run: python -m pip install -q .

      - name: Run native configured replay tests
        shell: bash
        run: |
          cd /tmp
          python - <<'PY'
          import os
          import pathlib
          import pytest
          import rust_core
          import sys

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert rust_core.RUST_CORE_AVAILABLE is True
          assert callable(rust_core.run_rsi_revert_opens_configured_py)
          sys.path.insert(1, str(workspace))
          sys.path.insert(2, str(workspace / 'trading_system'))
          raise SystemExit(pytest.main([
              str(workspace / 'tests/test_canonical_replay.py'),
              str(workspace / 'tests/test_alpha_validation.py'),
              '--import-mode=importlib',
              '-q',
          ]))
          PY

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_core/src/strategies.rs rust_core/src/lib.rs \
            scripts/backtest_framework/canonical_replay.py scripts/challenger_manager.py \
            tests/test_canonical_replay.py tests/test_alpha_validation.py
          git commit -m "feat: bind typed RSI parameters to canonical replay"
          git push origin HEAD:agent/configured-rsi-replay-v2
