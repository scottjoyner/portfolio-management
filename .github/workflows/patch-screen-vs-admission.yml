name: One-shot screen versus admission patch

on:
  push:
    branches:
      - agent/economic-edge-coherence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/economic-edge-coherence
          fetch-depth: 0

      - name: Separate screening from automated execution admission
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('apps/api/src/opportunityGenerator.mjs')
          text = generator.read_text()
          marker = "same_window_screen_requires_certification"
          if marker not in text:
              text = text.replace(
                  "import { createOpportunity, createResearchJob, decideOpportunity, ensureOpportunityState } from './opportunityFlows.mjs';",
                  "import { createOpportunity, createResearchJob, ensureOpportunityState } from './opportunityFlows.mjs';",
                  1,
              )
              old = """    backtestStatus: 'same_window_30d_screen_uncertified',\n    estimatedFees: Number(signal.estimated_fees || 5),"""
              new = """    backtestStatus: 'same_window_30d_screen_uncertified',\n    executionAdmission: {\n      policy: 'same_window_screen_requires_certification',\n      status: 'screen_only',\n      autoDraftEligible: false,\n      researchCertification: 'uncertified',\n      reason: 'same_window_30d_screen_uncertified',\n    },\n    estimatedFees: Number(signal.estimated_fees || 5),"""
              if old not in text:
                  raise SystemExit('strategy admission anchor missing')
              text = text.replace(old, new, 1)

              old = """    const { opportunity } = opportunityResult;\n    const approvalResult = decideOpportunity(state, opportunity.id, {\n      status: 'approved',\n      reviewer: 'system:auto-draft',\n      reason: `Auto-approved from live 30d strategy scan: ${signal.strategy} win_rate=${(Number(signal.win_rate || 0) * 100).toFixed(1)}% sentiment=${Number(signal.sentiment_score || 0).toFixed(2)}`,\n    });\n\n    if (approvalResult.errors) {\n      errors.push({ symbol, strategy: signal.strategy, code: 'approval_failed', errors: approvalResult.errors });\n      continue;\n    }\n\n    created.push(approvalResult.opportunity || opportunity);\n    if (approvalResult.execution) executions.push(approvalResult.execution);"""
              new = """    const { opportunity } = opportunityResult;\n    // This scanner is a same-window discovery screen, not certified research.\n    // Keep the candidate reviewable but never convert it into an execution\n    // draft here. A later certified-admission path must explicitly authorize\n    // automated drafting.\n    created.push(opportunity);"""
              if old not in text:
                  raise SystemExit('auto-draft block anchor missing')
              text = text.replace(old, new, 1)
              generator.write_text(text)

          flows = Path('apps/api/src/opportunityFlowsLegacy.mjs')
          text = flows.read_text()
          if "auto_execution_research_certification_required" not in text:
              old = """    tradePlan: body.tradePlan || null,\n    status: body.status || 'needs_review',"""
              new = """    tradePlan: body.tradePlan || null,\n    executionAdmission: body.executionAdmission && typeof body.executionAdmission === 'object'\n      ? { ...body.executionAdmission }\n      : null,\n    status: body.status || 'needs_review',"""
              if old not in text:
                  raise SystemExit('execution admission persistence anchor missing')
              text = text.replace(old, new, 1)

              old = """  let approvedExecutionSize = null;\n  if (body.status === 'approved') {\n    const rawExecutionSize = opportunity.positionSizing?.recommendedSize ?? opportunity.totalMoneyRisked;"""
              new = """  let approvedExecutionSize = null;\n  if (body.status === 'approved') {\n    const reviewer = String(body.reviewer || 'operator');\n    const isAutomatedApproval = reviewer.startsWith('system:auto');\n    if (isAutomatedApproval) {\n      if (opportunity.executionAdmission?.autoDraftEligible !== true) {\n        return { errors: ['auto_execution_research_certification_required'] };\n      }\n      const isEntry = opportunity.tradeIntent === 'entry'\n        || ['open_long', 'open_short'].includes(String(opportunity.executionPurpose || ''));\n      const netEdgeUsd = Number(opportunity.netExpectedValue);\n      if (isEntry && (!Number.isFinite(netEdgeUsd) || netEdgeUsd <= 0)) {\n        return { errors: ['auto_execution_positive_net_edge_required'] };\n      }\n    }\n    const rawExecutionSize = opportunity.positionSizing?.recommendedSize ?? opportunity.totalMoneyRisked;"""
              if old not in text:
                  raise SystemExit('approval gate anchor missing')
              text = text.replace(old, new, 1)
              flows.write_text(text)
          PY

          node --check apps/api/src/opportunityGenerator.mjs
          node --check apps/api/src/opportunityFlowsLegacy.mjs
          git diff --check

      - name: Add focused regressions
        run: |
          cat >> tests/strategy-opportunity-economics.test.mjs <<'EOF'

          test('same-window strategy screen is explicitly ineligible for automatic execution draft', () => {
            const state = baseState();
            const input = strategySignalToOpportunityInput(entrySignal());
            assert.equal(input.executionAdmission.status, 'screen_only');
            assert.equal(input.executionAdmission.autoDraftEligible, false);
            assert.equal(input.executionAdmission.researchCertification, 'uncertified');

            const created = createOpportunity(state, input, '2026-09-11T20:00:00.000Z');
            assert.equal(created.errors, undefined);
            assert.equal(created.opportunity.executionAdmission.autoDraftEligible, false);

            const decision = decideOpportunity(state, created.opportunity.id, {
              status: 'approved',
              reviewer: 'system:auto-draft',
            }, '2026-09-11T20:01:00.000Z');

            assert.deepEqual(decision.errors, ['auto_execution_research_certification_required']);
            assert.equal(created.opportunity.status, 'needs_review');
            assert.equal(state.executions.length, 0);
          });

          test('automated certified entry still requires positive net USD edge', () => {
            const state = baseState();
            const input = strategySignalToOpportunityInput(entrySignal());
            input.executionAdmission = {
              policy: 'canonical_research_admission_v1',
              status: 'certified',
              autoDraftEligible: true,
              researchCertification: 'canonical_tournament',
            };
            input.grossExpectedValue = 5;
            input.expectedValue = 5;
            input.estimatedFees = 5;
            input.estimatedSlippage = 3;

            const created = createOpportunity(state, input, '2026-09-11T20:00:00.000Z');
            assert.equal(created.errors, undefined);
            assert.equal(created.opportunity.netExpectedValue, -3);

            const decision = decideOpportunity(state, created.opportunity.id, {
              status: 'approved',
              reviewer: 'system:auto-certified',
            }, '2026-09-11T20:01:00.000Z');

            assert.deepEqual(decision.errors, ['auto_execution_positive_net_edge_required']);
            assert.equal(created.opportunity.status, 'needs_review');
            assert.equal(state.executions.length, 0);
          });
          EOF

          node --test tests/strategy-opportunity-economics.test.mjs

      - name: Commit production changes and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-screen-vs-admission.yml
          git add apps/api/src/opportunityGenerator.mjs apps/api/src/opportunityFlowsLegacy.mjs tests/strategy-opportunity-economics.test.mjs
          git commit -m 'separate strategy screening from execution admission'
          git push origin HEAD:agent/economic-edge-coherence
