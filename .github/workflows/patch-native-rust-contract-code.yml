name: One-shot native Rust contract code patch

on:
  push:
    branches:
      - agent/alpha-validation-engine
    paths:
      - .github/workflows/patch-native-rust-contract-code.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-validation-engine
          fetch-depth: 1
      - name: Patch native contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("strategy_engine.py")
          text = path.read_text(encoding="utf-8")
          old = '''try:\n    import rust_core as _rust_core\n    _HAS_RUST = True\n    logger.info("Rust core loaded — native acceleration enabled (%d strategies)",\n                len(_RUST_STRATEGIES))\nexcept ImportError:  # pragma: no cover\n    _HAS_RUST = False\n    logger.info("Rust core not available — using pure Python")\n    _rust_core = None  # type: ignore\n'''
          new = '''_RUST_REQUIRED_SYMBOLS = (\n    "run_strategy_opens_py",\n    "evaluate_all_opens_py",\n    "backtest_multi_py",\n    "backtest_strategy_py",\n)\n\ntry:\n    import rust_core as _rust_core\n    _RUST_MISSING_SYMBOLS = tuple(\n        name for name in _RUST_REQUIRED_SYMBOLS\n        if not callable(getattr(_rust_core, name, None))\n    )\n    _HAS_RUST = not _RUST_MISSING_SYMBOLS\n    if _HAS_RUST:\n        logger.info("Rust core loaded — native acceleration enabled (%d strategies)",\n                    len(_RUST_STRATEGIES))\n    else:\n        logger.warning(\n            "rust_core import resolved without required native symbols %s — using pure Python",\n            ", ".join(_RUST_MISSING_SYMBOLS),\n        )\nexcept ImportError:  # pragma: no cover\n    _HAS_RUST = False\n    _RUST_MISSING_SYMBOLS = _RUST_REQUIRED_SYMBOLS\n    logger.info("Rust core not available — using pure Python")\n    _rust_core = None  # type: ignore\n'''
          if text.count(old) != 1:
              raise SystemExit(f"strategy_engine match count={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("scripts/backtest_framework/canonical_replay.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''RUNNER_ID = "scripts.backtest_framework.canonical_replay"\n\n\ndef _runner_source_sha256() -> str:\n'''
          replacement = '''RUNNER_ID = "scripts.backtest_framework.canonical_replay"\nREQUIRED_RUST_SYMBOLS = ("run_strategy_opens_py", "backtest_strategy_py")\n\n\ndef canonical_rust_backend_available() -> bool:\n    """Return True only for a compiled rust_core with replay-required exports."""\n\n    try:\n        import rust_core\n    except ImportError:\n        return False\n    return all(callable(getattr(rust_core, name, None)) for name in REQUIRED_RUST_SYMBOLS)\n\n\ndef _require_rust_core():\n    """Return the compiled backend or fail closed on namespace/stale modules."""\n\n    try:\n        import rust_core\n    except ImportError as exc:\n        raise RuntimeError("compiled rust_core is required for canonical replay") from exc\n    missing = [\n        name for name in REQUIRED_RUST_SYMBOLS\n        if not callable(getattr(rust_core, name, None))\n    ]\n    if missing:\n        raise RuntimeError(\n            "compiled rust_core is missing required canonical replay symbols: "\n            + ", ".join(missing)\n        )\n    return rust_core\n\n\ndef _runner_source_sha256() -> str:\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"canonical helper anchor count={text.count(anchor)}")
          text = text.replace(anchor, replacement)
          old_import = '''    try:\n        import rust_core\n    except ImportError as exc:  # fail closed: this is the canonical Rust path\n        raise RuntimeError("rust_core is required for canonical replay") from exc\n\n    closes = [row[4] for row in normalized]\n'''
          new_import = '''    rust_core = _require_rust_core()\n\n    closes = [row[4] for row in normalized]\n'''
          if text.count(old_import) != 1:
              raise SystemExit(f"canonical import match count={text.count(old_import)}")
          path.write_text(text.replace(old_import, new_import), encoding="utf-8")

          path = Path("tests/test_canonical_replay.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''def _rows(n: int = 360) -> list[list[float]]:\n'''
          replacement = '''def _require_native_replay() -> None:\n    if not C.canonical_rust_backend_available():\n        pytest.skip("compiled rust_core replay bindings unavailable")\n\n\ndef _rows(n: int = 360) -> list[list[float]]:\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"test helper anchor count={text.count(anchor)}")
          text = text.replace(anchor, replacement)
          old = '''def _bound_evidence(rows: list[list[float]]) -> tuple[dict, dict]:\n    snapshot = C.snapshot_from_rows(\n'''
          new = '''def _bound_evidence(rows: list[list[float]]) -> tuple[dict, dict]:\n    _require_native_replay()\n    snapshot = C.snapshot_from_rows(\n'''
          if text.count(old) != 1:
              raise SystemExit(f"bound helper count={text.count(old)}")
          text = text.replace(old, new)
          old = '''def test_canonical_replay_trade_returns_match_rust_backtester():\n    if not S._HAS_RUST:\n        pytest.skip("Rust extension unavailable")\n\n    rows = _rows()\n'''
          new = '''def test_canonical_replay_trade_returns_match_rust_backtester():\n    _require_native_replay()\n    assert S._HAS_RUST, "strategy_engine must recognize the compiled native backend"\n\n    rows = _rows()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"native parity count={text.count(old)}")
          text = text.replace(old, new)
          old = '''def test_binding_rejects_attestation_for_other_returns():\n    rows = _rows()\n'''
          new = '''def test_binding_rejects_attestation_for_other_returns():\n    _require_native_replay()\n    rows = _rows()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"binding guard count={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- strategy_engine.py scripts/backtest_framework/canonical_replay.py tests/test_canonical_replay.py
      - name: Commit code patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_engine.py scripts/backtest_framework/canonical_replay.py tests/test_canonical_replay.py
          git commit -m "fix: require compiled Rust replay contract"
          git push origin HEAD:agent/alpha-validation-engine
