name: local-trader-agent

on:
  pull_request:
    paths:
      - "sidecars/local-trader-agent/**"
      - ".github/workflows/local-trader-agent.yml"
  push:
    branches:
      - add-local-trader-agent-sidecar
    paths:
      - "sidecars/local-trader-agent/**"
      - ".github/workflows/local-trader-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/local-trader-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy local_trader_agent
