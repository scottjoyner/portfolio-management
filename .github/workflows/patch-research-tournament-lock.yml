name: One-shot research tournament lock patch

on:
  push:
    branches:
      - agent/research-integrity-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/research-integrity-hardening
          fetch-depth: 0

      - name: Apply registry transaction lock
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/research_tournament.py")
          text = path.read_text()
          marker = "def _registry_mutation(method):"
          if marker in text:
              print("registry lock patch already present")
              raise SystemExit(0)

          text = text.replace(
              "import uuid\nfrom dataclasses import asdict, dataclass\n",
              "import uuid\nfrom contextlib import contextmanager\nfrom dataclasses import asdict, dataclass\nfrom functools import wraps\n",
          )
          text = text.replace(
              "from typing import Any, Sequence\n",
              "from typing import Any, Iterator, Sequence\n\ntry:\n    import fcntl\nexcept ImportError:  # pragma: no cover - supported deployment targets are POSIX\n    fcntl = None\n",
          )

          helper = '''

          @contextmanager
          def _exclusive_file_lock(path: Path) -> Iterator[None]:
              if fcntl is None:
                  raise RuntimeError("interprocess tournament locking is unavailable on this platform")
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("a+", encoding="utf-8") as lock_handle:
                  fcntl.flock(lock_handle.fileno(), fcntl.LOCK_EX)
                  try:
                      yield
                  finally:
                      fcntl.flock(lock_handle.fileno(), fcntl.LOCK_UN)


          def _registry_mutation(method):
              """Serialize one complete tournament state transition."""

              @wraps(method)
              def wrapped(self, *args, **kwargs):
                  with _exclusive_file_lock(self.registry_lock_path):
                      return method(self, *args, **kwargs)

              return wrapped
          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines())
          text = text.replace("\n\nclass ResearchTournament:\n", helper + "\n\nclass ResearchTournament:\n")

          text = text.replace(
              "        self.registry_path = Path(registry_path)\n        self.lineage = lineage or LineageStore()\n",
              "        self.registry_path = Path(registry_path)\n        self.registry_lock_path = self.registry_path.with_name(f\".{self.registry_path.name}.lock\")\n        self.lineage = lineage or LineageStore()\n",
          )

          for name in (
              "create_from_snapshot",
              "register_candidate",
              "seal_selection",
              "run_terminal_holdout",
          ):
              needle = f"    def {name}(\n"
              replacement = f"    @_registry_mutation\n    def {name}(\n"
              if needle not in text:
                  raise SystemExit(f"missing expected method: {name}")
              text = text.replace(needle, replacement, 1)

          path.write_text(text)
          PY

          python -m py_compile scripts/research_tournament.py
          git diff --check

      - name: Commit production patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research_tournament.py
          git commit -m "harden research tournament state transitions"
          git push origin HEAD:agent/research-integrity-hardening
