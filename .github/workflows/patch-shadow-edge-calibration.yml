name: One-shot shadow edge calibration wiring

on:
  push:
    branches:
      - agent/shadow-edge-calibration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-edge-calibration
          fetch-depth: 0
      - name: Wire forward shadow calibration into economic admission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/economics/src/economicDecisionEngine.mjs')
          text = path.read_text()
          if "from './certifiedShadowCalibration.mjs'" not in text:
              anchor = "} from './certifiedShadowAttribution.mjs';\n"
              replacement = anchor + "import {\n  applyCertifiedShadowCalibration,\n  buildCertifiedShadowCalibration,\n} from './certifiedShadowCalibration.mjs';\n"
              if anchor not in text:
                  raise SystemExit('economic engine import anchor missing')
              text = text.replace(anchor, replacement, 1)

          old = '''  const decision = result?.economicDecision;\n  if (!decision) return result;\n\n  const shadow = createCertifiedShadowTrial(state, {'''
          new = '''  const decision = result?.economicDecision;\n  if (!decision) return result;\n\n  const rawNetExecutableEdgeUsd = decision.netExecutableEdgeUsd;\n  let shadowCalibration = null;\n  if (bound.observation) {\n    shadowCalibration = buildCertifiedShadowCalibration(state, {\n      runtimeIdentityHash: bound.observation.runtimeIdentityHash,\n      symbol: bound.observation.symbol,\n    }, now);\n    applyCertifiedShadowCalibration(decision, shadowCalibration, {\n      minimumNetEdgeUsd: bound.body.minimumNetEdgeUsd ?? 0,\n    });\n  }\n\n  // Shadow measurement must continue to score the raw economic forecast, not\n  // the already-calibrated edge, otherwise the feedback loop would train on\n  // its own discounted prediction and hide model overstatement.\n  const shadowDecision = shadowCalibration\n    ? { ...decision, netExecutableEdgeUsd: rawNetExecutableEdgeUsd }\n    : decision;\n  const shadow = createCertifiedShadowTrial(state, {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const rawNetExecutableEdgeUsd = decision.netExecutableEdgeUsd;' not in text:
              raise SystemExit('economic calibration insertion anchor missing')

          old = '''    economicDecision: decision,\n    runtimeCertification: bound.body.runtimeCertification || null,'''
          new = '''    economicDecision: shadowDecision,\n    runtimeCertification: bound.body.runtimeCertification || null,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'economicDecision: shadowDecision' not in text:
              raise SystemExit('shadow raw decision anchor missing')
          path.write_text(text)

          path = Path('packages/economics/src/certifiedShadowAttributionLegacy.mjs')
          text = path.read_text()
          old = '''    economicDecisionId: decision.id,\n    executionCostSnapshotId: decision.executionCostSnapshotId || null,\n    signalObservedAt,'''
          new = '''    economicDecisionId: decision.id,\n    executionCostSnapshotId: decision.executionCostSnapshotId || null,\n    certifiedShadowSignalObservationId: body.certifiedShadowSignalObservationId || signal?.id || null,\n    signalObservedAt,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'certifiedShadowSignalObservationId: body.certifiedShadowSignalObservationId' not in text:
              raise SystemExit('shadow signal id anchor missing')
          path.write_text(text)

          path = Path('tests/certified-shadow-attribution.test.mjs')
          text = path.read_text()
          text = text.replace(
              "test('certified SELL forecast edge is signed in trade direction and opens shadow trial', () => {",
              "test('certified SELL edge is signed but admission waits for forward shadow calibration', () => {",
              1,
          )
          old = '''  assert.equal(result.economicDecision.predictedEdgeUsd, 10);\n  assert.equal(result.economicDecision.netExecutableEdgeUsd, 8);\n  assert.equal(result.economicDecision.executionAllowed, true);\n  assert.ok(result.certifiedShadowTrial);\n  assert.equal(result.certifiedShadowTrial.side, 'SELL');\n  assert.equal(result.certifiedShadowTrial.predictedNetExecutableEdgeUsd, 8);'''
          new = '''  assert.equal(result.economicDecision.predictedEdgeUsd, 10);\n  assert.equal(result.economicDecision.rawNetExecutableEdgeUsd, 8);\n  assert.equal(result.economicDecision.netExecutableEdgeUsd, 8);\n  assert.equal(result.economicDecision.executionAllowed, false);\n  assert.equal(result.economicDecision.shadowCalibration.ready, false);\n  assert.ok(result.economicDecision.blockers.includes('certified_shadow_calibration_insufficient_samples'));\n  assert.ok(result.certifiedShadowTrial);\n  assert.equal(result.certifiedShadowTrial.side, 'SELL');\n  assert.equal(result.certifiedShadowTrial.predictedNetExecutableEdgeUsd, 8);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'shadowCalibration.ready' not in text:
              raise SystemExit('shadow attribution expectation anchor missing')
          path.write_text(text)
          PY

          node --check packages/economics/src/certifiedShadowCalibration.mjs
          node --check packages/economics/src/certifiedShadowAttributionLegacy.mjs
          node --check packages/economics/src/economicDecisionEngine.mjs
          node --test tests/certified-shadow-calibration.test.mjs tests/certified-shadow-attribution.test.mjs tests/economic-decision-engine.test.mjs tests/economic-api-gates.test.mjs tests/execution-overseer*.test.mjs
          git diff --check

      - name: Commit production calibration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-shadow-edge-calibration.yml
          git add packages/economics/src/certifiedShadowCalibration.mjs packages/economics/src/certifiedShadowAttributionLegacy.mjs packages/economics/src/economicDecisionEngine.mjs tests/certified-shadow-calibration.test.mjs tests/certified-shadow-attribution.test.mjs
          git commit -m 'calibrate executable edge from forward shadow outcomes'
          git push origin HEAD:agent/shadow-edge-calibration
