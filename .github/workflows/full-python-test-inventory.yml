name: Full Python Test Inventory

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: full-python-test-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-python-test-inventory:
    name: full-python-test-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/trading_system
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          deploy/requirements.venv-lock.txt
    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r deploy/requirements.venv-lock.txt
        python -m pip install pytest-asyncio
    - name: Record collected test inventory
      run: |
        set -o pipefail
        python -m pytest tests/ trading_system/tests/ \
          --import-mode=importlib \
          --collect-only \
          -q | tee full-python-collection.txt
    - name: Run every collected Python test
      run: |
        set -o pipefail
        python -m pytest tests/ trading_system/tests/ \
          --import-mode=importlib \
          -q | tee full-python-results.txt
    - name: Upload full test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-python-test-inventory-${{ github.sha }}
        path: |
          full-python-collection.txt
          full-python-results.txt
        if-no-files-found: warn
        retention-days: 14
