name: Full Python Test Inventory

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: full-python-test-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maintained-python-inventory:
    name: maintained-python-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/trading_system
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          deploy/requirements.venv-lock.txt
    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r deploy/requirements.venv-lock.txt
        python -m pip install pytest-asyncio
    - name: Collect every maintained Python test in an isolated process
      run: |
        set -o pipefail
        python -m pytest tests/ trading_system/tests/ \
          --ignore=tests/coverage \
          --import-mode=importlib \
          --collect-only \
          -q | tee maintained-python-collection.txt
    - name: Run every maintained Python test
      run: |
        set -o pipefail
        python -m pytest tests/ trading_system/tests/ \
          --ignore=tests/coverage \
          --import-mode=importlib \
          -q | tee maintained-python-results.txt
    - name: Upload maintained test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maintained-python-inventory-${{ github.sha }}
        path: |
          maintained-python-collection.txt
          maintained-python-results.txt
        if-no-files-found: warn
        retention-days: 14

  coverage-python-inventory:
    name: coverage-python-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/trading_system
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          deploy/requirements.venv-lock.txt
    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r deploy/requirements.venv-lock.txt
        python -m pip install pytest-asyncio
    - name: Collect generated coverage tests in their own process
      run: |
        set -o pipefail
        python -m pytest tests/coverage/ \
          --import-mode=importlib \
          --collect-only \
          -q | tee coverage-python-collection.txt
    - name: Run generated coverage tests in their own process
      run: |
        set -o pipefail
        python -m pytest tests/coverage/ \
          --import-mode=importlib \
          -q | tee coverage-python-results.txt
    - name: Upload coverage test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-python-inventory-${{ github.sha }}
        path: |
          coverage-python-collection.txt
          coverage-python-results.txt
        if-no-files-found: warn
        retention-days: 14
