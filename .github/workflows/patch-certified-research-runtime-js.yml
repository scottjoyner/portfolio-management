name: One-shot certified research runtime JS wiring

on:
  push:
    branches:
      - agent/certified-research-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certified-research-runtime
          fetch-depth: 0

      - name: Apply and validate certified execution admission
        run: |
          python .github/scripts/patch_certified_runtime_js_v3.py
          node --check apps/api/src/opportunityGenerator.mjs
          node --check apps/api/src/opportunityFlowsLegacy.mjs
          node --check packages/execution/src/researchCertification.mjs
          node --check packages/execution/src/overseer.mjs
          node --check packages/execution/src/executionEngine.mjs
          node --check packages/storage/src/executionRepository.mjs
          node --test \
            tests/research-certification-execution.test.mjs \
            tests/strategy-opportunity-economics.test.mjs \
            tests/execution-overseer.test.mjs \
            tests/execution-engine.test.mjs
          git diff --check

      - name: Commit production wiring
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/opportunityGenerator.mjs \
            apps/api/src/opportunityFlowsLegacy.mjs \
            packages/execution/src/overseer.mjs \
            packages/execution/src/executionEngine.mjs \
            packages/storage/src/executionRepository.mjs
          git commit -m 'gate strategy entries on certified research and economics'
          git push origin HEAD:agent/certified-research-runtime
