name: One-shot certified research runtime Python wiring

on:
  push:
    branches:
      - agent/certified-research-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certified-research-runtime
          fetch-depth: 0

      - name: Wire promotion credential and exact configured scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          # Challenger promotion publishes an optional runtime credential.
          path = Path('scripts/challenger_manager.py')
          text = path.read_text()
          if 'build_runtime_research_certification' not in text:
              anchor = 'from scripts.research_tournament import verify_terminal_holdout_evidence\n'
              replacement = anchor + 'from scripts.runtime_research_certification import build_runtime_research_certification\n'
              if anchor not in text:
                  raise SystemExit('challenger import anchor missing')
              text = text.replace(anchor, replacement, 1)

          if 'research_certification = build_runtime_research_certification(' not in text:
              anchor = '''        if challenger.get("evaluation", {}).get("terminal_holdout_verified") is not True:\n            raise ValueError("challenger evaluation did not verify terminal holdout")\n\n        previous = None\n'''
              replacement = '''        if challenger.get("evaluation", {}).get("terminal_holdout_verified") is not True:\n            raise ValueError("challenger evaluation did not verify terminal holdout")\n\n        research_certification = build_runtime_research_certification(\n            challenger, evidence, terminal_evidence\n        )\n\n        previous = None\n'''
              if anchor not in text:
                  raise SystemExit('challenger certification anchor missing')
              text = text.replace(anchor, replacement, 1)

          if '"research_certification": research_certification,' not in text:
              anchor = '''            "terminal_holdout_evidence_hash": terminal_hash,\n            "promoted_at": _utc_now(),\n'''
              replacement = '''            "terminal_holdout_evidence_hash": terminal_hash,\n            "research_certification": research_certification,\n            "promoted_at": _utc_now(),\n'''
              if anchor not in text:
                  raise SystemExit('challenger config anchor missing')
              text = text.replace(anchor, replacement, 1)

          if '"research_certification_hash": research_certification.get("certification_hash") if research_certification else None,' not in text:
              anchor = '''                "terminal_holdout_evidence_hash": terminal_hash,\n            },\n            actor="promotion-gate",\n'''
              replacement = '''                "terminal_holdout_evidence_hash": terminal_hash,\n                "research_certification_hash": research_certification.get("certification_hash") if research_certification else None,\n            },\n            actor="promotion-gate",\n'''
              if anchor not in text:
                  raise SystemExit('promotion event anchor missing')
              text = text.replace(anchor, replacement, 1)
              anchor2 = '''                "terminal_holdout_evidence_hash": terminal_hash,\n            }\n        )\n'''
              replacement2 = '''                "terminal_holdout_evidence_hash": terminal_hash,\n                "research_certification_hash": research_certification.get("certification_hash") if research_certification else None,\n            }\n        )\n'''
              if anchor2 not in text:
                  raise SystemExit('promotion record anchor missing')
              text = text.replace(anchor2, replacement2, 1)
          path.write_text(text)

          # Scanner applies the exact promoted config only on its certified scope.
          path = Path('scripts/strategy_signal_scanner.py')
          text = path.read_text()
          if 'from types import SimpleNamespace' not in text:
              anchor = 'from typing import Any\n'
              if anchor not in text:
                  raise SystemExit('scanner types import anchor missing')
              text = text.replace(anchor, anchor + 'from types import SimpleNamespace\n', 1)
          if 'from scripts.runtime_research_certification import (' not in text:
              anchor = 'from trading_system.signal_confidence import ConfidenceEngine  # noqa: E402\n'
              replacement = anchor + '''from scripts.runtime_research_certification import (  # noqa: E402\n    bind_certification_to_runtime,\n    load_active_research_certification,\n    run_certified_current_signal,\n)\n'''
              if anchor not in text:
                  raise SystemExit('scanner runtime import anchor missing')
              text = text.replace(anchor, replacement, 1)

          old_sig = 'def scan_product(product_id: str, granularity: str, days_back: int, min_win_rate: float, min_weighted_confidence: float, cache_ttl_seconds: int = 900, refresh: bool = False) -> list[dict[str, Any]]:'
          new_sig = 'def scan_product(product_id: str, granularity: str, days_back: int, min_win_rate: float, min_weighted_confidence: float, cache_ttl_seconds: int = 900, refresh: bool = False, active_certification: dict[str, Any] | None = None) -> list[dict[str, Any]]:'
          if new_sig not in text:
              if old_sig not in text:
                  raise SystemExit('scanner signature anchor missing')
              text = text.replace(old_sig, new_sig, 1)

          if 'runtime_certification = bind_certification_to_runtime(' not in text:
              anchor = '''    all_signals = run_strategies(product_id, asset_class, closes, volumes, current_price, highs=highs, lows=lows)\n    consensus = _global_consensus(all_signals)\n'''
              replacement = '''    all_signals = run_strategies(product_id, asset_class, closes, volumes, current_price, highs=highs, lows=lows)\n    runtime_certification = bind_certification_to_runtime(\n        active_certification, product_id=product_id, granularity=granularity\n    )\n    if runtime_certification is not None:\n        certified_strategy = runtime_certification["strategy_name"]\n        # Never allow the default-parameter instance of the certified strategy\n        # to masquerade as the promoted configuration.\n        all_signals = [\n            signal for signal in all_signals\n            if str(getattr(signal, "strategy", "")) != certified_strategy\n        ]\n        certified = run_certified_current_signal(\n            runtime_certification, closes=closes, volumes=volumes, highs=highs, lows=lows\n        )\n        if certified is not None and certified.get("action") != "HOLD":\n            all_signals.append(SimpleNamespace(\n                action=certified["action"],\n                confidence=certified["confidence"],\n                reason=certified["reason"],\n                strategy=certified["strategy"],\n                research_certification=certified["research_certification"],\n            ))\n    consensus = _global_consensus(all_signals)\n'''
              if anchor not in text:
                  raise SystemExit('scanner signal anchor missing')
              text = text.replace(anchor, replacement, 1)

          if 'terminal_metrics = certification.get("terminal_metrics")' not in text:
              anchor = '''    def evaluate(signal: Any) -> dict[str, Any] | None:\n        verdict = backtest_strategy(signal.strategy, product_id, closes, volumes, highs=highs, lows=lows)\n        if verdict.total_trades < 3 or verdict.win_rate < min_win_rate:\n            return None\n\n        strength = max(0.05, min(1.0, float(getattr(signal, "confidence", 0.5))))\n'''
              replacement = '''    def evaluate(signal: Any) -> dict[str, Any] | None:\n        certification = getattr(signal, "research_certification", None)\n        if isinstance(certification, dict):\n            terminal_metrics = certification.get("terminal_metrics") or {}\n            try:\n                verdict = SimpleNamespace(\n                    total_trades=int(terminal_metrics.get("trade_count", 0)),\n                    win_rate=float(terminal_metrics.get("win_rate", 0.0)),\n                    total_return_pct=float(terminal_metrics.get("total_return_pct", 0.0)),\n                    sharpe_ratio=float(terminal_metrics.get("sharpe", 0.0)),\n                    profit_factor=float(terminal_metrics.get("profit_factor", 0.0)),\n                    max_drawdown_pct=float(terminal_metrics.get("max_drawdown_pct", 0.0)),\n                    reason="Certified one-shot terminal holdout",\n                )\n            except (TypeError, ValueError):\n                return None\n            if verdict.total_trades <= 0:\n                return None\n        else:\n            verdict = backtest_strategy(signal.strategy, product_id, closes, volumes, highs=highs, lows=lows)\n            if verdict.total_trades < 3 or verdict.win_rate < min_win_rate:\n                return None\n\n        strength = max(0.05, min(1.0, float(getattr(signal, "confidence", 0.5))))\n'''
              if anchor not in text:
                  raise SystemExit('scanner evaluation anchor missing')
              text = text.replace(anchor, replacement, 1)

          if '"research_certification": certification,' not in text:
              anchor = '''            "market_direction": "bullish" if sentiment_score >= 0 else "bearish",\n        }\n'''
              replacement = '''            "market_direction": "bullish" if sentiment_score >= 0 else "bearish",\n            "tournament_certified": isinstance(certification, dict),\n            "validation_scope": (\n                "tournament_terminal_promoted_exact_runtime"\n                if isinstance(certification, dict)\n                else "same_window_in_sample_screen"\n            ),\n            "research_certification": certification,\n        }\n'''
              if anchor not in text:
                  raise SystemExit('scanner result anchor missing')
              text = text.replace(anchor, replacement, 1)

          if 'active_certification = load_active_research_certification()' not in text:
              anchor = '''    started = time.time()\n    candidates: list[dict[str, Any]] = []\n'''
              replacement = '''    started = time.time()\n    candidates: list[dict[str, Any]] = []\n    active_certification = load_active_research_certification()\n'''
              if anchor not in text:
                  raise SystemExit('scanner main anchor missing')
              text = text.replace(anchor, replacement, 1)

          old_submit = 'pool.submit(scan_product, product_id, args.granularity, args.days_back, args.min_win_rate, args.min_weighted_confidence, args.cache_ttl, args.refresh): product_id'
          new_submit = 'pool.submit(scan_product, product_id, args.granularity, args.days_back, args.min_win_rate, args.min_weighted_confidence, args.cache_ttl, args.refresh, active_certification): product_id'
          if new_submit not in text:
              if old_submit not in text:
                  raise SystemExit('scanner submit anchor missing')
              text = text.replace(old_submit, new_submit, 1)

          if '"active_research_certification_hash":' not in text:
              anchor = '''        "min_weighted_confidence": args.min_weighted_confidence,\n        "entry_count": len(entry_signals),\n'''
              replacement = '''        "min_weighted_confidence": args.min_weighted_confidence,\n        "active_research_certification_hash": (\n            active_certification.get("certification_hash")\n            if isinstance(active_certification, dict) else None\n        ),\n        "entry_count": len(entry_signals),\n'''
              if anchor not in text:
                  raise SystemExit('scanner payload anchor missing')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY

          python -m py_compile scripts/challenger_manager.py scripts/strategy_signal_scanner.py scripts/runtime_research_certification.py
          pytest -q tests/test_runtime_research_certification.py tests/test_alpha_validation.py
          git diff --check

      - name: Commit production wiring
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/challenger_manager.py scripts/strategy_signal_scanner.py
          git commit -m 'wire promoted research certification into scanner runtime'
          git push origin HEAD:agent/certified-research-runtime
