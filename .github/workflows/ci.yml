name: Trading Strategies CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/trading_system

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate tracked runtime artifacts
      run: node scripts/validate-runtime-artifacts.mjs

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          deploy/requirements.venv-lock.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r deploy/requirements.venv-lock.txt
        python -m pip install pytest-asyncio

    - name: Run canonical Python tests
      run: |
        python -m pytest tests/ trading_system/tests/unit/ \
          --ignore=tests/coverage \
          --import-mode=importlib \
          --cov=trading_system \
          --cov-report=xml

    - name: Run Node tests
      run: node --test tests/**/*.test.mjs tests/integration/*.test.mjs

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Run performance benchmarks
      run: python performance_benchmarks/run_all_tests.py

    - name: Generate report
      run: python performance_benchmarks/cli_report_generator.py --output=benchmark-report.html

  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: test
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/trading_system

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate tracked runtime artifacts
      run: node scripts/validate-runtime-artifacts.mjs

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          deploy/requirements.venv-lock.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r deploy/requirements.venv-lock.txt
        python -m pip install pytest-asyncio

    - name: Produce coverage data for the gate
      run: |
        python -m coverage run --source=. -m pytest tests/ trading_system/tests/unit/ \
          --ignore=tests/coverage \
          --import-mode=importlib \
          -q

    - name: Run coverage gate (90% per-module)
      run: bash scripts/run_coverage_gate.sh
