name: CI

on:
  push:
    branches: [main]
    paths: ["trading_system/**"]
  pull_request:
    branches: [main]
    paths: ["trading_system/**"]

defaults:
  run:
    working-directory: trading_system

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

