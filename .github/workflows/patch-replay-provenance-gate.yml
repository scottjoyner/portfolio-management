name: One-shot replay provenance gate patch

on:
  push:
    branches:
      - agent/alpha-validation-engine
    paths:
      - .github/workflows/patch-replay-provenance-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-validation-engine
          fetch-depth: 1
      - name: Patch challenger promotion gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/challenger_manager.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'from scripts.alpha_validation import evidence_to_challenger_metrics, verify_alpha_validation_evidence\nfrom scripts.learning_lineage import LineageStore',
                  'from scripts.alpha_validation import evidence_to_challenger_metrics, verify_alpha_validation_evidence\nfrom scripts.backtest_framework.canonical_replay import verify_evidence_replay_binding\nfrom scripts.learning_lineage import LineageStore',
              ),
              (
                  'def evaluate_challenger_evidence(\n    incumbent: dict[str, Any],\n    evidence: Any,\n    thresholds: dict[str, Any] | None = None,\n) -> dict[str, Any]:',
                  'def evaluate_challenger_evidence(\n    incumbent: dict[str, Any],\n    evidence: Any,\n    thresholds: dict[str, Any] | None = None,\n    *,\n    require_replay_provenance: bool = False,\n) -> dict[str, Any]:',
              ),
              (
                  '    challenger_metrics = evidence_to_challenger_metrics(evidence)\n',
                  '''    if require_replay_provenance:\n        if evidence.get("replay_provenance_bound") is not True:\n            return {\n                "approved": False,\n                "reasons": ["alpha_validation_replay_provenance_required"],\n                "pnl_improvement_usd": 0.0,\n                "drawdown_increase_pct_points": 0.0,\n                "thresholds": {**DEFAULT_THRESHOLDS, **(thresholds or {})},\n                "evaluated_at": _utc_now(),\n                "evidence_hash": evidence.get("evidence_hash"),\n                "evidence_schema_version": evidence.get("schema_version"),\n            }\n        replay_valid, replay_reasons = verify_evidence_replay_binding(\n            evidence, reverify_source=True\n        )\n        if not replay_valid:\n            return {\n                "approved": False,\n                "reasons": [\n                    f"alpha_validation_replay_invalid:{reason}"\n                    for reason in replay_reasons\n                ],\n                "pnl_improvement_usd": 0.0,\n                "drawdown_increase_pct_points": 0.0,\n                "thresholds": {**DEFAULT_THRESHOLDS, **(thresholds or {})},\n                "evaluated_at": _utc_now(),\n                "evidence_hash": evidence.get("evidence_hash"),\n                "evidence_schema_version": evidence.get("schema_version"),\n            }\n\n    challenger_metrics = evidence_to_challenger_metrics(evidence)\n''',
              ),
              (
                  '        else:\n            result = evaluate_challenger_evidence(incumbent_metrics, validation_evidence, thresholds)\n',
                  '        else:\n            result = evaluate_challenger_evidence(\n                incumbent_metrics, validation_evidence, thresholds,\n                require_replay_provenance=True,\n            )\n',
              ),
              (
                  '        if evidence.get("candidate_id") != challenger_id:\n            raise ValueError("challenger alpha-validation candidate mismatch")\n',
                  '''        if evidence.get("replay_provenance_bound") is not True:\n            raise ValueError("challenger alpha-validation replay provenance is required")\n        replay_valid, replay_reasons = verify_evidence_replay_binding(\n            evidence, reverify_source=True\n        )\n        if not replay_valid:\n            raise ValueError(\n                "challenger alpha-validation replay provenance is invalid: "\n                + ",".join(replay_reasons)\n            )\n        if evidence.get("candidate_id") != challenger_id:\n            raise ValueError("challenger alpha-validation candidate mismatch")\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/challenger_manager.py
      - name: Commit replay provenance gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/challenger_manager.py
          git commit -m "feat: require canonical replay provenance for promotion"
          git push origin HEAD:agent/alpha-validation-engine
