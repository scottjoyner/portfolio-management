name: One-shot configured RSI replay v2

on:
  push:
    branches:
      - agent/configured-rsi-replay
    paths:
      - .github/workflows/patch-configured-rsi-replay-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configured-rsi-replay
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply guarded configured RSI replay patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-configured-rsi-replay.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''replace_once(\n    'scripts/backtest_framework/canonical_replay.py',\n    \'''    snapshot = load_canonical_snapshot(\\n\''',\n    \'''    normalized_strategy_config = normalize_strategy_config(strategy_name, strategy_config)\\n    if normalized_strategy_config and candidate_config != normalized_strategy_config:\\n        raise ValueError("candidate_config must equal the executable strategy_config")\\n\\n    snapshot = load_canonical_snapshot(\\n\''',\n    'builder executable candidate config check',\n)'''
          new = '''p = Path('scripts/backtest_framework/canonical_replay.py')\ntext = p.read_text(encoding='utf-8')\nmarker = 'def build_alpha_evidence_from_canonical_replay(\\n'\nstart = text.index(marker)\nneedle = '    snapshot = load_canonical_snapshot(\\n'\npos = text.index(needle, start)\ninsert = '    normalized_strategy_config = normalize_strategy_config(strategy_name, strategy_config)\\n    if normalized_strategy_config and candidate_config != normalized_strategy_config:\\n        raise ValueError("candidate_config must equal the executable strategy_config")\\n\\n'\ntext = text[:pos] + insert + text[pos:]\np.write_text(text, encoding='utf-8')'''
          if script.count(old) != 1:
              raise SystemExit(f'expected one builder patch block in workflow source, found {script.count(old)}')
          script = script.replace(old, new)
          exec(compile(script, '<configured-rsi-v2>', 'exec'), globals(), globals())
          PY
          git diff --check
          git diff --stat

      - name: Run Rust unit tests
        working-directory: rust_core
        run: cargo test --locked

      - name: Run portable focused tests
        run: |
          python -m pip install -q -r deploy/requirements.venv-lock.txt
          python -m pytest tests/test_alpha_validation.py tests/test_canonical_replay.py --import-mode=importlib -q

      - name: Build exact Rust package and run native configured replay tests
        shell: bash
        run: |
          python -m pip install -q .
          cd /tmp
          python - <<'PY'
          import os
          import pathlib
          import rust_core
          import sys
          import pytest
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert rust_core.RUST_CORE_AVAILABLE is True
          assert callable(rust_core.run_rsi_revert_opens_configured_py)
          sys.path.insert(1, str(workspace))
          sys.path.insert(2, str(workspace / 'trading_system'))
          raise SystemExit(pytest.main([
              str(workspace / 'tests/test_canonical_replay.py'),
              str(workspace / 'tests/test_alpha_validation.py'),
              '--import-mode=importlib', '-q',
          ]))
          PY

      - name: Commit typed configured replay slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_core/src/strategies.rs rust_core/src/lib.rs \
            scripts/backtest_framework/canonical_replay.py scripts/challenger_manager.py \
            tests/test_canonical_replay.py tests/test_alpha_validation.py
          git commit -m "feat: bind typed RSI parameters to canonical replay"
          git push origin HEAD:agent/configured-rsi-replay
