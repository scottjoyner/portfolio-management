<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio OS — Operator Console</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-brand">
        <span class="brand-dot">PM</span>
        <div><strong>Portfolio OS</strong><span class="label">paper console</span></div>
      </div>
      <div class="topbar-center" id="topbar-status">
        <span class="status-dot live"></span>
        <span id="topbar-uptime">Connected</span>
        <span class="label" id="topbar-refresh-time"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-refresh" title="Refresh all data">Refresh</button>
        <button id="btn-kill-switch" class="btn-danger" title="Toggle kill switch">Kill</button>
      </div>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <nav id="nav-tabs">
          <a href="#dashboard" class="nav-active">Dashboard</a>
          <a href="#portfolio">Portfolio</a>
          <a href="#markets">Markets</a>
          <a href="#signals">Signals</a>
          <a href="#opportunities">Opportunities</a>
          <a href="#execution">Execution</a>
          <a href="#kalshi">Kalshi</a>
          <a href="#polymarket">Polymarket</a>
          <a href="#audit">Audit</a>
          <a href="#sweeper">Sweeper</a>
          <a href="#adapters">Adapters</a>
          <a href="#settings">Settings</a>
        </nav>
        <div id="sidebar-stats">
          <div class="stat-line"><span class="label">Executions</span><strong id="s-exec-count">0</strong></div>
          <div class="stat-line"><span class="label">Opportunities</span><strong id="s-opp-count">0</strong></div>
          <div class="stat-line"><span class="label">Positions</span><strong id="s-pos-count">0</strong></div>
          <div class="stat-line"><span class="label">Audit Events</span><strong id="s-audit-count">0</strong></div>
        </div>
      </aside>

      <main id="content">
        <section id="live-ticker" class="ticker-bar">
          <div class="ticker-bar-inner" id="ticker-inner">Loading prices…</div>
        </section>
        <section id="activity-feed-panel">
          <div class="panel-header">
            <span class="eyebrow">Live Feed</span>
            <span id="feed-count" class="label">0 events</span>
          </div>
          <div id="activity-feed"><div class="feed-empty">Waiting for events…</div></div>
        </section>

        <section id="kpi-strip" class="kpi-strip"></section>

        <section id="tab-content">
          <div class="tab-placeholder">Select a tab from the sidebar</div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
