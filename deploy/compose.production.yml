services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      STRICT_RUNTIME_VALIDATION: "true"
      PORT: "3000"
      OPERATOR_STORE: postgres
      DATABASE_URL: ${DATABASE_URL}
      OPERATOR_AUTH_REQUIRED: "true"
      OPERATOR_ADMIN_TOKEN: ${OPERATOR_ADMIN_TOKEN}
      OPERATOR_PAPER_TOKEN: ${OPERATOR_PAPER_TOKEN:-}
      OPERATOR_READONLY_TOKEN: ${OPERATOR_READONLY_TOKEN:-}
      CSRF_REQUIRED: "true"
      OPERATOR_CSRF_TOKEN: ${OPERATOR_CSRF_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      ALLOW_POLYMARKET_ORDER_SUBMISSION: "false"
      ALLOW_LIVE_SETTLEMENT_REDEMPTION: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
