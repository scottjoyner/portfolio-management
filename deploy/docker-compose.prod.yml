# Trading System Production Deployment Stack
# Build context: repo root (portfolio-management/)
# NOTE: Docker Compose is the canonical deploy path.

services:
  trading-service:
    image: ghcr.io/falcon/trading-system:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    container_name: trading-runtime-prod
    restart: unless-stopped
    environment:
      - RPC_URL=https://eth-mainnet.g.alchemy.com/v2/YOUR_RPC_KEY
      - METADATA_CACHE_TTL=3600
      - EVENT_QUEUE_CAPACITY=10000
      - LOG_LEVEL=INFO
      - ONCHAIN_NETWORKS=ethereum,arbitrum,optimism,base,polygon,avalanche
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:9090/ping'); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
