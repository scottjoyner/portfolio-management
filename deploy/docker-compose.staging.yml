# Trading System Staging Deployment Stack
# Build context: repo root (portfolio-management/)
# NOTE: Docker Compose is the canonical deploy path.

services:
  trading-service:
    image: ghcr.io/falcon/trading-system:staging-latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
      args:
        ENVIRONMENT: staging
    container_name: trading-runtime-staging
    restart: unless-stopped
    environment:
      - RPC_URL=https://eth-goerli.alchemy.com/v2/YOUR_GOERLI_KEY
      - METADATA_CACHE_TTL=600
      - EVENT_QUEUE_CAPACITY=5000
      - LOG_LEVEL=DEBUG
      - ONCHAIN_NETWORKS=ethereum,goerli,sepolia
      - STAGING_MODE=true
    volumes:
      - ./logs/staging:/app/logs
      - ./data/staging:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:9090/ping'); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
