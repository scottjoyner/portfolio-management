```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-api
  labels:
    app: trading-system
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-system
      component: api
  template:
    metadata:
      labels:
        app: trading-system
        component: api
    spec:
      containers:
      - name: api
        image: trading-system:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: TRADING_MODE
          value: "PAPER"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trading-db
              key: url
        - name: REDIS_URL
          value: "redis://trading-redis:6379/0"
        - name: REQUIRE_APPROVALS
          value: "true"
        - name: LIVE_TRADING_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-api
spec:
  selector:
    app: trading-system
    component: api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
```
