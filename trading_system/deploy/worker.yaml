```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-worker
  labels:
    app: trading-system
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-system
      component: worker
  template:
    metadata:
      labels:
        app: trading-system
        component: worker
    spec:
      containers:
      - name: worker
        image: trading-system:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "apps.worker.main"]
        env:
        - name: APP_ENV
          value: "production"
        - name: TRADING_MODE
          value: "PAPER"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trading-db
              key: url
        - name: REDIS_URL
          value: "redis://trading-redis:6379/0"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-worker-canary
  labels:
    app: trading-system
    component: worker
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-system
      component: worker
      track: canary
  template:
    metadata:
      labels:
        app: trading-system
        component: worker
        track: canary
    spec:
      containers:
      - name: worker
        image: trading-system:canary
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "apps.worker.main"]
        env:
        - name: APP_ENV
          value: "canary"
        - name: TRADING_MODE
          value: "CANARY"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trading-db
              key: url
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
```
