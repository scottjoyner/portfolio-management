[pytest]
testpaths =
    tests
    trading_system/tests
    coinbase/tests
    event_markets
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider
markers =
    slow: starts a real server or waits on real network; deselect with -m 'not slow'
filterwarnings =
    ignore::DeprecationWarning
