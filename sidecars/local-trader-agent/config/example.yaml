llm:
  base_url: "http://127.0.0.1:8080/v1"
  model: "local-model"
  temperature: 0.1
  max_tokens: 2048

backtest:
  ticker: "GOOGL"
  start: "2020-01-01"
  end: null
  interval: "1d"
  rsi_period: 14
  buy_rsi_cross: 30
