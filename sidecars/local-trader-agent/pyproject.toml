[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-trader-agent"
version = "0.1.0"
description = "Local LLM-driven trading research agent with deterministic backtesting and HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Local Trader Agent"}]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "plotly>=5.20",
  "yfinance>=0.2.60",
  "requests>=2.31",
  "pydantic>=2.7",
  "PyYAML>=6.0"
]

[project.scripts]
local-trader-agent = "local_trader_agent.cli:main"

[tool.setuptools.packages.find]
include = ["local_trader_agent*"]
