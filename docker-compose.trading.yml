services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_password
      POSTGRES_DB: trading
    volumes:
      - trading_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  trading-api:
    build:
      context: .
      dockerfile: Dockerfile.trading
    user: root
    container_name: trading-api
    command: ["uvicorn", "trading_system.apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      TRADING_EVENTS_PATH: /app/runtime/events/trading-events.jsonl
      DATABASE_URL: postgresql://trading:trading_dev_password@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    secrets:
      - coinbase_cdp_api_key
    volumes:
      - trading_runtime:/app/runtime
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  trading-ui:
    build:
      context: .
      dockerfile: Dockerfile.trading
    container_name: trading-ui
    command: ["uvicorn", "trading_system.apps.ui.main:app", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      TRADING_API_URL: http://trading-api:8000
    ports:
      - "8501:8501"
    depends_on:
      trading-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  trading-worker:
    build:
      context: .
      dockerfile: Dockerfile.trading
    container_name: trading-worker
    command: ["python", "-m", "trading_system.apps.worker.main"]
    environment:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      TRADING_EVENTS_PATH: /app/runtime/events/trading-events.jsonl
      DATABASE_URL: postgresql://trading:trading_dev_password@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    secrets:
      - coinbase_cdp_api_key
    volumes:
      - trading_runtime:/app/runtime
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

secrets:
  coinbase_cdp_api_key:
    file: /home/scott/.coinbase/cdp_api_key.json

volumes:
  trading_postgres:
  trading_runtime:
