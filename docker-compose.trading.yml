# Trading System Docker Compose
# Full deployment with backtester, API, and UI dashboard

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secure}
      POSTGRES_DB: trading
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coinbase-cli:
    build:
      context: ./trading_system/connectors
      dockerfile: Dockerfile.coinbase-cli
    command: tail -f /dev/null
    env_file: .env.coinbase
    volumes:
      - ~/.coinbase:/root/.coinbase:ro
      - coinbase_logs:/logs
    depends_on:
      - postgres
      - redis

  trading-api:
    build:
      context: ./trading_system
      dockerfile: Dockerfile.api
    command: uvicorn trading_system.apps.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - TRADING_MODE=paper
      - LIVE_TRADING_ENABLED=true
      - POSTGRES_URL=postgresql://trader:trader_secure@postgres:5432/trading
      - REDIS_URL=redis://redis:6379
    volumes:
      - ..:/app
      - ~/.coinbase:/root/.coinbase:ro
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      coinbase-cli:
        condition: service_started
    restart: unless-stopped

  backtester:
    build:
      context: ./trading_system
      dockerfile: Dockerfile.backtester
    command: python -m trading_system.backtester --interval=1h --output=/results
    env_file: .env
    environment:
      - TRADING_MODE=paper
      - BACKTESTING_ENABLED=true
    volumes:
      - ..:/app
      - backtest_results:/results
      - ~/.coinbase:/root/.coinbase:ro
    depends_on:
      postgres:
        condition: service_healthy
      trading-api:
        condition: service_started
    restart: unless-stopped

  ui-dashboard:
    build:
      context: ./trading_system
      dockerfile: Dockerfile.api
    command: uvicorn trading_system.apps.ui.main:app --host 0.0.0.0 --port 8501
    environment:
      - TRADING_API_URL=http://trading-api:8000
    ports: ["8501:8501"]
    depends_on:
      trading-api:
        condition: service_started
    restart: unless-stopped

  strategy-worker:
    build:
      context: ./trading_system
      dockerfile: Dockerfile.api
    command: python -m trading_system.apps.worker.main --strategies=all
    env_file: .env
    environment:
      - TRADING_MODE=paper
      - LIVE_TRADING_ENABLED=true
    volumes:
      - ..:/app
      - ~/.coinbase:/root/.coinbase:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-api:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  coinbase_logs:
  backtest_results:
